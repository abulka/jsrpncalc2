<!doctype html>
<html>
<head>
    <title>jsrpncalc2</title>
    
        <!-- WARNING: for iOS 7, remove the width=device-width and height=device-height attributes. See https://issues.apache.org/jira/browse/CB-4323 -->
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
        <!--<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, target-densitydpi=device-dpi" />-->

		<link rel="stylesheet" href="js/jquery.mobile-1.4.0/jquery.mobile-1.4.0.css">
</head>
<body ng-app>
<div data-role="page" id="foo">

    <div data-role="header">
        <h1>jsrpncalc2</h1>
    </div>
    <!-- /header -->

    <div data-role="content">
        <p ng-show="sometext" ng-cloak>Hello world {{ sometext | uppercase }}</p>
        <input type="text" ng-model="sometext" />

        <p><a href="#bar">Goto Page 2</a></p>

		<div ng-controller="AndyController">
		   <!-- Main input -->
			<input type="text" ng-model="newcontact"/>
		   <!-- Key buttons -->
		   <div class="ui-grid-b">
			   <div class="ui-block-a">
			   		<a href="#" class="ui-btn ui-shadow ui-corner-all" ng-click="click1(1)">1</a>
			   </div>
			   <div class="ui-block-b">
			   		<a href="#" class="ui-btn ui-shadow ui-corner-all" ng-click="click1(2)">2</a>
			   </div>
			   <div class="ui-block-c">
			   		<a href="#" class="ui-btn ui-shadow ui-corner-all" ng-click="click1(3)">3</a>
			   </div>
		   </div>
		   <!-- Add / Clear -->
		   <div class="ui-grid-a ui-responsive">
			   <div class="ui-block-a">
				   <a href="#" class="ui-btn ui-btn-b ui-shadow ui-corner-all" ng-click="add()">Add</a>
			   </div>
			   <div class="ui-block-b">
				   <a href="#" class="ui-btn ui-btn-b ui-shadow ui-corner-all" ng-click="zap()">Clear</a>
			   </div>
		   </div>
			<!-- list of items added, automatically rendered by angular -->
			<ul>
				<li ng-repeat="contact in contacts track by $index" ng-bind-html-unsafe="contact" ng-cloak>
				{{ contact }}
				</li>
			</ul>
		</div>

		<!-- Key buttons (non angular, to see if its faster) -->
        <div>
			<input type="text" id="current"/>
            <div class="ui-grid-b">
                <div class="ui-block-a">
                     <a href="#" class="ui-btn ui-shadow ui-corner-all" id="click4">4</a>
                </div>
                <div class="ui-block-b">
                     <a href="#" class="ui-btn ui-shadow ui-corner-all" id="click5">5</a>
                </div>
                <div class="ui-block-c">
                     <a href="#" class="ui-btn ui-shadow ui-corner-all" id="click6">6</a>
                </div>
            </div>
		</div>


    </div>
    <!-- /content -->

    <div data-role="footer">
        <h4>My Footer</h4>
    </div>
    <!-- /footer -->

</div>
<!-- /page -->


<!-- Start of second page -->
<div data-role="page" id="bar">

    <div data-role="header">
        <h1>Bar</h1>
    </div>
    <!-- /header -->

    <div role="main" class="ui-content">
        <p>I'm the second in the source order so I'm hidden when the page loads. I'm just shown if a link that
            references my id is being clicked.</p>

        <p><a href="#foo">Back to page 1</a></p>

        <form>
            <label for="slider-0">Input slider:</label>
            <input type="range" name="slider" id="slider-0" value="25" min="0" max="100"/>
        </form>

    </div>
    <!-- /content -->

    <div data-role="footer">
        <h4>Page Footer</h4>
    </div>
    <!-- /footer -->
</div>
<!-- /page -->

	<script type="text/javascript" src="phonegap.js"></script>
	<script type="text/javascript" src="js/index.js"></script>
	<script src="js/jquery-2.1.0.js"></script>

	<script src="js/jquery.mobile-1.4.0/jquery.mobile-1.4.0.js"></script>
	<script src="js/angular-1.2.9.min.js"></script>
    <script src="js/angular-touch-1.2.9.min.js"></script>
	<script type='application/javascript' src='js/fastclick.js'></script>
	<script type="text/javascript">
		$(function() {
			FastClick.attach(document.body);
		});
        angular.module('myApp', ['ngTouch']);  // doesn't seem to help
	    app.initialize();

		function AndyController($scope) {
			$scope.contacts = ["hi@email.com", "hello@email.com"];
 			$scope.newcontact = "";
 
			$scope.add = function() {
				$scope.contacts.push($scope.newcontact);
				$scope.newcontact = "";
				console.log($scope.contacts);
			}

			$scope.zap = function() {
				$scope.contacts = [];
				$scope.newcontact = "";
			}

			$scope.click1 = function(key) {
				$scope.newcontact += key;
			}
		}

        // Wire up the non angular buttons and input box
        var current_in = $('#current');
        var btns = $('#click4,#click5,#click6');
        function appendDigit(s) {
            current_in.val(current_in.val() + s).keyup();
        }
        btns.on('vmousedown', function(event, ui) {
            appendDigit(event.target.text);
            if (current_in.val().length > 25)
                current_in.val('');
        });

	</script>
        
</body>
</html>
